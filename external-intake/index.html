<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Support request</title><script src="/app.js" defer></script>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#17322a;background:#f2f6f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(570px,100%);background:#fff;border:1px solid #dce8dd;border-radius:18px;box-shadow:0 18px 50px #1e4b2c14;padding:clamp(24px,5vw,42px)}.eyebrow{font-size:11px;letter-spacing:.15em;font-weight:700;color:#388063;text-transform:uppercase}h1{font-size:clamp(28px,5vw,38px);letter-spacing:-.04em;line-height:1.12;margin:12px 0}p{color:#60786a;font-size:14px;line-height:1.6;margin:0 0 25px}label{display:block;font-size:13px;font-weight:650;margin:18px 0 8px}input,textarea{display:block;width:100%;margin-top:8px;border:1px solid #ceded1;border-radius:9px;background:#fcfefb;color:#17322a;padding:13px;font:inherit;font-size:14px}textarea{resize:vertical;min-height:140px}input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #83d8ae;outline-offset:2px}button{border:0;border-radius:9px;background:#147553;color:#fff;font:inherit;font-size:14px;font-weight:700;padding:13px 18px;margin-top:13px;cursor:pointer}button:hover{background:#0d5e42}button:disabled{opacity:.6;cursor:wait}.result{margin-top:22px;border-radius:10px;padding:14px 16px;background:#e9f6ec;color:#175b3d;font-size:13px;line-height:1.6;overflow-wrap:anywhere}.result.error{background:#fff0ed;color:#a34639}.result[hidden]{display:none}
  </style>
</head>
<body>
  <main class="card"><span class="eyebrow">Team support</span><h1>Submit a support request</h1><p>Tell us what happened and how it affects your team. Your request will be sent to the support queue for review.</p>
    <form id="intake-form"><label>Subject<input name="title" required minlength="3" maxlength="120" placeholder="e.g. Daily report export is unavailable"></label><label>What happened?<textarea name="message" required minlength="10" maxlength="5000" placeholder="Describe the issue, who is affected, and what you need." ></textarea></label><button type="submit">Send request →</button></form>
    <div id="result" class="result" role="status" aria-live="polite" hidden></div>
  </main>
</body>
</html>
